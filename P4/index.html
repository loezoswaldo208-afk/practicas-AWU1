<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Alumno</title>
    <link href="css/estiloPerfil.css" rel="stylesheet"/>
</head>
<body>

  <h2>Registro de Credencial</h2>

  <form id="formRegistro">
    <label for="nombre">Nombre completo:</label>
    <input type="text" id="nombre" placeholder="Ej. Anahí Torres" required>

    <label for="matricula">Matrícula / ID:</label>
    <input type="text" id="matricula" placeholder="Ej. 2025345" required>

    <label for="carrera">Carrera / Especialidad:</label>
    <input type="text" id="carrera" placeholder="Ej. DSM" required>

    <button type="button" onclick="guardarEnviar();">Generar Credencial</button>
  </form>

  <script src="js/funciones.js"></script>

</body>
</html>
