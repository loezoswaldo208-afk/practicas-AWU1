<div class="modal" id="myModalNuevo">

        <h4 class="modal-title">Nuevo Maestro</h4>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <!-- Modal body -->
      <div class="modal-body">
      </div>
      <form action="indexAdmin.html">
  <div class="mb-3">
    <label for="pwd" class="form-label">Nombre:</label>
    <input type="text" class="form-control" id="nombre" placeholder="Nombre/s" name="nombre">
  </div>
  <div class="mb-3">
    <label for="pwd" class="form-label">Apellido:</label>
    <input type="text" class="form-control" id="apellido" placeholder="Apellido/s" name="apellido">
  </div>
  
  <div class="mb-3 mt-3">
    <label for="email" class="form-label">Correo:</label>
    <input type="email" class="form-control" id="email" placeholder="Ejemplo a@gmail.com" name="email">
  </div>
  
  <div class="form-check mb-3">
  </div>
  <button type="submit" class="btn btn-primary">Iniciar Sesion</button>
</form>

      <!-- Modal footer -->
      <div class="modal-footer">
        <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Close</button>
      </div>

    </div>
  </div>
