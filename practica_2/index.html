<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta author="Anahí Torres">
    <meta keywords="desarrollo web, ingeniería de software">
    <!--Vínculo a estilos-->
    <link rel="stylesheet" href="css/estilo.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <title>Formularios y JS</title>
</head>
<body>
    <header>
        <img src="img/LogoErick.png" width="100" height="100" alt="Imagen logotipo de marca" title="Logotipo" /> 
        <nav>
            <ul>
                <li><a href="index.html" target="_parent">Registro</a></li>
                <li><a href="contacto.html" target="_parent">Opción 2</a></li>
                <li><a href="https://www.youtube.com/" target="_blank">Opción 3</a></li>
                <li><a>Opción 4</a></li>
                <li><a>Opción 5</a></li>   
            </ul>
        </nav>
    </header>

    <main>
        <section id="principal">
            <article>
                <form name="frmUsuario" action="#" method="post" enctype="multipart/form-data">
                    <fieldset>
                        <legend>Datos de Registro:</legend>
                        <div id="dregistro">
                            <label>Fecha de registro:</label>
                            <input type="date" id="fecha" />
                        </div>
                    </fieldset>

                    <fieldset id="datos_user"> 
                        <legend>Datos del usuario:</legend>
                        <div id="nombre_completo">
                            <div> 
                                <label>Nombre: </label>
                                <input type="text" id="nombre" />
                            </div>
                            <div>
                                <label>Apellido Paterno: </label>
                                <input type="text" id="apellidoP" />
                            </div>
                            <div>
                                <label>Apellido Materno:</label>
                                <input type="text" id="apellidoM" />
                            </div>
                        </div>

                        <div id="otros_datos"> 
                            <div id="tipo_sangre">
                                <label>Tipo de Sange:</label>
                                <input type="radio" name="tsangre" id="tsangre1" value="O+">O+
                                <input type="radio" name="tsangre" id="tsangre2" value="B+">B+
                                <input type="radio" name="tsangre" id="tsangre3" value="A-">A-
                                <input type="radio" name="tsangre" id="tsangre4" value="A+">A+
                            </div>
                            <div id="genero">
                                <label> Género:</label>
                                <input type="radio" name="genero" id="genero1" value="F">Femenino
                                <input type="radio" name="genero" id="genero2" value="M">Masculino
                            </div>
                            <div>
                                <label> Ciudad de Origen</label>
                                <select id="ciudad">
                                    <option value="1">San francisco</option>
                                    <option value="2">Leon</option>
                                    <option value="3">Guanajuato</option>
                                </select>
                            </div>
                            <div>
                                <label>Foto:</label>
                                <input type="file" id="foto" />
                            </div>
                        </div>
                    </fieldset>

                    <fieldset>
                        <legend>Datos del inicio de sesión</legend>
                        <div>
                            <label>Email </label>
                            <input type="email" id="mail" placeholder="ejemplo:a@correo.com" required autofocus/>
                        </div>
                        <div>
                            <label>Contraseña</label>
                            <input type="password" id="contrasena" required maxlength="9" minlength="9"/>
                        </div>
                    </fieldset>

                    <fieldset>
                        <legend>Generalidades </legend>
                        <div>
                            <label>Color Favorito:</label>
                            <input type="color" id="color" />
                        </div>
                        <div>
                            <label>Comentarios</label>
                            <textarea cols="50" rows="10"></textarea>
                        </div>
                    </fieldset> 
                    
                    <button id="boton" onclick="mi_metodo();">Registrar</button>
                </form>
            </article>
        </section>
    </main>

    <footer>
        <article id="rrss" class="pie">Redes Sociales</article>
        <article id="contacto" class="pie">
            <i>Nombre Apellido</i>
            <p>477-xxx-xxxx</p>
        </article>
        <article class="pie">
            <a href="faq.html">FAQ</a> <br>
            <span class="material-symbols-outlined">
                login
            </span>
        </article>
    </footer>
    <script src="js/funcionalidad.js"></script>
</body>
</html>
