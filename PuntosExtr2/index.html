<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcular Sueldo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
    <main>
        <article>
            <h2>Calcular el sueldo</h2>
            <form id="calculadora" name="calculadora" onsubmit="return false;">
                <label>Sueldo:</label>
                <input type="number" name="piezas" class="form-control mb-2" style="max-width: 200px;" placeholder="Ej. 5">
                
                <label>Categoria:</label>
                <input type="" name="precio" class="form-control mb-2" style="max-width: 200px;" placeholder="Ej. 25.50">
                
                <div class="mb-2">
                    <button type="button" class="btn btn-warning" onclick="calcular();">Calcular</button>
                </div>
            </form>

            <p class="alert alert-success" id="resultado" style="min-height: 48px; max-width: 300px;"></p>
        </article>
    </main>
    <script src="js/funcion.js"></script>
</body>
</html>
