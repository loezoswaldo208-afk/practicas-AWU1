<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket de Consumo</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<section class="card">
    <h2>Coffee & Boba</h2>
    <p class="linea-detalle"><strong>Cliente:</strong> <span id="salidaCliente">---</span></p>
    <hr class="mi_linea">
    <h3>Detalle de consumo:</h3>
<ul id="salidaListaProductos">
</ul>
<article class="linea-detalle">
    <span>Subtotal:</span>
    <span id="salidaSubtotal">$0.00</span>
</article>
<article class="linea-detalle">
    <span>Descuento aplicado:</span>
    <span id="salidaDescuento">-$0.00</span>
</article>
<article class="linea-detalle total-destacado">
    <span>Total a pagar:</span>
    <span id="salidaTotal">$0.00</span>
</article>
</section>
<script src="js/ticket.js"></script>
</body>
</html>
