<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Area o Volumen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@100;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="fondo.css">
</head>
<body>

<main>
    <h2>Que Calcularas</h2>
    <form id="tipoValor">

        <label for="tipo">Volumen o Area:</label>
        <article class="grupo-inline">
            <select id="tipo">
                <option value="Volumen">Volumen</option>
                <option value="Area">Area</option>
            </select>
        </article>

        <label for="figuras1">Selecciona tu figura:</label>
        <article class="grupo-inline">
            <select id="figuras1">
                <option value="Cubo">Cubo</option>
                <option value="Esfera">Esfera</option>
                <option value="Prisma Triangular">Prisma Triangular</option>
            </select>

            <select id="figuras2">
                <option value="Triangulo">Triangulo</option>
                <option value="Trapecio">Trapecio</option>
                <option value="Circulo">Circulo</option>
            </select>
        </article>

        <label for="medida">Medida:</label>
        <input type="number" id="medida" placeholder="Ingresa una medida">

        <label for="altura">Altura:</label>
        <input type="number" id="altura" placeholder="Ingresa la altura">

        <button type="button" class="btn-secundario" onclick="calcular();">Calcular</button>

        <button type="button" id="btnBorrar">Borrar</button>

        <h3 id="resultado">Resultado:</h3>

    </form>
</main>

<script src="funciones/funciones.js"></script>
</body>
</html>
